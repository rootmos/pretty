[project]
name = "pretty"
version = "0.1.0"
requires-python = ">=3.13,<4"
dependencies = []

[dependency-groups]
test = [
    "pytest (>=9.1.1,<10)",
    "parameterized (>=0.9.0,<0.10.0)",
]
yaml = [
    "ruamel-yaml (>=0.19.1,<0.20.0)",
]

[tool.isort]
sort_relative_in_force_sorted_sections = true
sections = ['FUTURE', 'STDLIB', 'LOCALFOLDER', 'FIRSTPARTY', 'THIRDPARTY']

[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
